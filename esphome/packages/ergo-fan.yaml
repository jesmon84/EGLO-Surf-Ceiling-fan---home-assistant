# Shared config for EGLO Surf ceiling fans (Wemos D1 Mini replacing the stock Tuya
# WiFi module, talking to the fan's Tuya MCU over UART).
#
# Edit this file once, then Install on each fan.
# Each fan's own file only sets: name, friendly_name, static_ip, ap_ssid, api_key.
# See ../example-fan.yaml.

substitutions:
  # Defaults - override any of these in the per-fan file if your network differs.
  gateway: 192.168.1.1
  subnet: 255.255.255.0

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  # Restore the fan to its previous on/speed state after a reboot or power blip.
  on_boot:
    priority: -100
    then:
      - delay: 15s   # let the Tuya handshake finish
      - if:
          condition:
            lambda: 'return id(fan_was_on) && !id(ergo_fan).state;'
          then:
            - logger.log: "Restoring fan state after reboot"
            - fan.turn_on:
                id: ergo_fan
                speed: !lambda 'return id(fan_last_speed);'
      - delay: 2s
      - lambda: |-
          id(boot_done) = true;
          id(fan_was_on) = id(ergo_fan).state;
          if (id(ergo_fan).state) id(fan_last_speed) = id(ergo_fan).speed;

esp8266:
  board: d1_mini
  restore_from_flash: true

logger:
  baud_rate: 0   # keep serial logging off the UART used for Tuya

api:
  # Don't reboot the fan just because Home Assistant is down or restarting
  reboot_timeout: 0s
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # fixes random dropouts/unresponsiveness on ESP8266
  ap:
    ssid: ${ap_ssid}
    password: !secret hotspot_password

  manual_ip:
    gateway: ${gateway}
    static_ip: ${static_ip}
    subnet: ${subnet}

captive_portal:

preferences:
  flash_write_interval: 5min   # limit flash wear from the restore globals

globals:
  - id: fan_was_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: fan_last_speed
    type: int
    restore_value: true
    initial_value: '1'
  - id: boot_done
    type: bool
    restore_value: false
    initial_value: 'false'

# --- Diagnostics: useful for tracking down random reboots / turn-offs ---
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: wifi_info
    bssid:
      name: "WiFi BSSID"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap Free"

# --- Tuya MCU link ---
uart:
  id: tuya_uart
  tx_pin: GPIO5   # D1 on a D1 Mini
  rx_pin: GPIO4   # D2 on a D1 Mini
  baud_rate: 9600

tuya:
  id: fan_tuya

fan:
  - platform: tuya
    id: ergo_fan
    name: "Ergo Fan"
    switch_datapoint: 60
    speed_datapoint: 62
    speed_count: 5
    direction_datapoint: 63
    on_turn_on:
      - lambda: 'if (id(boot_done)) id(fan_was_on) = true;'
    on_turn_off:
      - lambda: 'if (id(boot_done)) id(fan_was_on) = false;'
    on_speed_set:
      - lambda: 'if (id(boot_done)) id(fan_last_speed) = x;'

light:
  - platform: tuya
    name: "Ergo Fan Light"
    switch_datapoint: 20
    dimmer_datapoint: 22
    min_value: 100
    max_value: 1000
    color_temperature_datapoint: 23
    color_temperature_invert: true   # without this, warm/cool are reversed
    color_temperature_max_value: 1000
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds

select:
  - platform: tuya
    name: "Ergo Fan Mode"
    enum_datapoint: 61
    optimistic: true
    options:
      0: "Normal"
      1: "Natural"
