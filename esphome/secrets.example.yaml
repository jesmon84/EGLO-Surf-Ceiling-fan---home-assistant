# Copy to secrets.yaml (which is git-ignored) and fill in your own values.
wifi_ssid: "YourWiFi"
wifi_password: "your-wifi-password"

# Shared password for every device's fallback hotspot
hotspot_password: "change-me"

# One API encryption key per fan. Generate a fresh 32-byte base64 key for each,
# e.g.  openssl rand -base64 32   (or let the ESPHome dashboard create one)
example_fan_api_key: "REPLACE_WITH_BASE64_KEY"
